# dev_user_role_binding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dev_user_role_binding
  namespace: clever-apps-namespace
subjects:
  - kind: User
    name: dev-user
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: dev_reader
  apiGroup: rbac.authorization.k8s.io